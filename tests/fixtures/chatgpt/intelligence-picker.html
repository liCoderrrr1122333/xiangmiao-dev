<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 16px sans-serif; }
  form { margin: 80px; }
  button, [role=menuitem], [role=menuitemradio] { padding: 12px; }
  [role=menu] { position: relative; width: 260px; }
  [inert] { position: absolute; transform: translateX(300px); opacity: 0; }
</style>
<form class="group/composer" data-type="unified-composer">
  <div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="与 ChatGPT 聊天"></div>
  <button type="button" class="__composer-pill" aria-haspopup="menu" aria-expanded="false" id="quality">极高</button>
</form>
<div role="menu" hidden>
  <div data-testid="composer-intelligence-picker-content">
    <div id="simple" data-testid="composer-model-picker-slider-simple-view" data-active="true">
      <div role="menuitem" tabindex="0" aria-expanded="false" aria-label="选择模型" id="choose">极高</div>
      <div role="menuitem" aria-label="能力">极高，第 4 项，共 5 项。</div>
    </div>
    <div id="advanced" data-testid="composer-model-picker-slider-advanced-view" data-active="false" inert>
      <div role="menuitemradio" aria-checked="true" tabindex="0">最新</div>
      <div role="menuitemradio" aria-checked="false" tabindex="0">GPT-5.6 Sol</div>
      <div role="menuitemradio" aria-checked="false" tabindex="0">GPT-5.5</div>
    </div>
  </div>
</div>
<script>
  const menu = document.querySelector('[role=menu]');
  const simple = document.querySelector('#simple');
  const advanced = document.querySelector('#advanced');
  const quality = document.querySelector('#quality');
  const choose = document.querySelector('#choose');
  window.fixtureClicks = { branch: 0, hiddenOption: 0, selection: 0 };
  function showAdvanced(active) {
    simple.inert = active;
    advanced.inert = !active;
    simple.dataset.active = String(!active);
    advanced.dataset.active = String(active);
    choose.setAttribute('aria-expanded', String(active));
  }
  quality.onclick = () => { menu.hidden = !menu.hidden; showAdvanced(false); };
  choose.onclick = () => { window.fixtureClicks.branch++; showAdvanced(true); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') menu.hidden = true; });
  advanced.querySelectorAll('[role=menuitemradio]').forEach(item => {
    item.onclick = () => {
      if (advanced.inert) { window.fixtureClicks.hiddenOption++; return; }
      window.fixtureClicks.selection++;
      advanced.querySelectorAll('[role=menuitemradio]').forEach(x => x.setAttribute('aria-checked', String(x === item)));
      quality.textContent = item.textContent === '最新' ? '极高' : item.textContent.replace('GPT-', '').replace(' Sol', '') + ' 极高';
      choose.textContent = quality.textContent;
      showAdvanced(false);
    };
  });
</script>
